version: '3.8'

# Development docker-compose with hot-reload
services:
  redis:
    image: redis:7-alpine
    container_name: trading-bot-redis-dev
    ports:
      - "6379:6379"
    networks:
      - trading-bot-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading-bot-backend-dev
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - SERVER_PORT=8080
      - WS_PORT=8081
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EXCHANGE_USE_TESTNET=true
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    networks:
      - trading-bot-network
    command: >
      sh -c "go mod download && go run ./cmd"

  strategy:
    build:
      context: ./strategy
      dockerfile: Dockerfile
    container_name: trading-bot-strategy-dev
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./strategy:/app
    depends_on:
      - redis
    networks:
      - trading-bot-network
    command: >
      sh -c "pip install -r requirements.txt && python -m strategy.app.main"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    container_name: trading-bot-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_STRATEGY_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8081/ws
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
      - strategy
    networks:
      - trading-bot-network
    command: npm run dev

networks:
  trading-bot-network:
    driver: bridge
