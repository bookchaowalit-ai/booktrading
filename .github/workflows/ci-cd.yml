name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy to production after tests and image builds pass'
        required: true
        default: false
        type: boolean

env:
  GO_VERSION: '1.21'
  NODE_VERSION: '24'
  DOCKER_BUILDKIT: 1

jobs:
  # ── Backend Tests ──────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: trading_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install dependencies
        run: |
          cd backend
          go mod download
          go mod tidy
          go mod verify

      - name: Run vet
        run: |
          cd backend
          go vet ./...

      - name: Run tests
        run: |
          cd backend
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: trading
          DATABASE_PASSWORD: testpassword
          DATABASE_NAME: trading_bot_test
          DATABASE_SSLMODE: disable
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          REDIS_DB: 0
          ENCRYPTION_KEY: test-encryption-key-32-chars-long!

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: backend/coverage.out
          flags: backend

  # ── Frontend Tests ─────────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run linter
        run: |
          cd frontend
          npm run lint

      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run tests
        run: |
          cd frontend
          npm test

  # ── Strategy Tests ─────────────────────────────────────────────────────────────
  strategy-test:
    name: Strategy Safety Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: strategy/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r strategy/requirements.txt

      - name: Run strategy tests
        run: >-
          python -m pytest
          strategy/tests/test_futures_safety.py
          strategy/tests/test_futures_backtest.py
          -q

      - name: Check strategy formatting and lint
        run: >-
          python -m ruff check strategy/app/futures_bot.py
          strategy/app/futures_backtest.py
          strategy/scripts/futures_preflight.py
          strategy/scripts/futures_backtest.py
          strategy/tests/test_futures_safety.py
          strategy/tests/test_futures_backtest.py

  # ── Build Docker Images ────────────────────────────────────────────────────────
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, strategy-test]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_production && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: bookfinance-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: bookfinance-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Strategy Image
        uses: docker/build-push-action@v5
        with:
          context: ./strategy
          push: false
          tags: bookfinance-strategy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Production ───────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/bookfinance
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --build
            docker system prune -af --volumes
