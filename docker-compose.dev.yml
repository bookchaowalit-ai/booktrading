# Development docker-compose with hot-reload
services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: trading-bot-postgres-dev
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=trading
      - POSTGRES_PASSWORD=${DB_PASSWORD:-trading123}
      - POSTGRES_DB=trading_bot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-bot-network

  redis:
    image: redis:7-alpine
    container_name: trading-bot-redis-dev
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-bot-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: trading-bot-backend-dev
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - SERVER_PORT=8080
      - WS_PORT=8081
      - GRPC_PORT=9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret}
      - REDIS_DB=0
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=trading
      - DATABASE_PASSWORD=${DB_PASSWORD:-trading123}
      - DATABASE_NAME=trading_bot
      - DATABASE_SSLMODE=disable
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change_me_in_production_32chars}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - EXCHANGE_USE_TESTNET=true
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - trading-bot-network
    command: >
      sh -c "go mod tidy && go run ./cmd"

  strategy:
    build:
      context: ./strategy
      dockerfile: Dockerfile
    container_name: trading-bot-strategy-dev
    ports:
      - "8001:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret}
      - REDIS_DB=0
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./strategy:/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trading-bot-network
    command: >
      sh -c "pip install -r requirements.txt && python -m app.main"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    container_name: trading-bot-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_STRATEGY_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8081/ws
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
      - strategy
    networks:
      - trading-bot-network
    command: npm run dev

networks:
  trading-bot-network:
    driver: bridge
